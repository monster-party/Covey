<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="theme-color" content="#f4efe8" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="apple-mobile-web-app-title" content="Covey" />
        <title>Covey – Your Family Calendar</title>
        <link rel="icon" href="icon.svg" type="image/svg+xml" />
        <link rel="manifest" href="site.webmanifest" />
        <link rel="apple-touch-icon" href="apple-touch-icon.png" />
        <link
            rel="apple-touch-icon"
            sizes="120x120"
            href="apple-touch-icon-120.png"
        />
        <link
            rel="apple-touch-icon"
            sizes="152x152"
            href="apple-touch-icon-152.png"
        />
        <link
            rel="apple-touch-icon"
            sizes="167x167"
            href="apple-touch-icon-167.png"
        />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="apple-touch-icon-180.png"
        />
        <!--SERVER-->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            bg: "var(--bg)",
                            card: "var(--card)",
                            ink: "var(--ink)",
                            mute: "var(--mute)",
                            line: "var(--line)",
                            accent: "var(--accent)",
                            on: "var(--on)",
                        },
                    },
                },
            };
        </script>

        <link rel="stylesheet" href="/style.css" />
    </head>
    <body class="app-loading bg-bg text-ink">
        <script>
            document.body.dataset.ambientTheme =
                document.documentElement.dataset.ambientTheme;
            document.body.dataset.ambientMode =
                document.documentElement.dataset.ambientMode;
        </script>
        <div
            id="splash"
            class="fixed inset-0 z-[999] flex items-center justify-center bg-bg"
            aria-hidden="true"
        >
            <div class="splash-atmosphere" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="splash-grain" aria-hidden="true"></div>
            <div class="splash-content flex flex-col items-center gap-6">
                <div class="splash-logo" aria-label="Covey">
                    <svg viewBox="0 0 35 34" aria-hidden="true">
                        <path d="M17.3392 12.3069C19.563 12.3069 21.3664 14.1103 21.3664 16.3341C21.3663 18.5578 19.563 20.3602 17.3392 20.3602C15.1157 20.3599 13.3132 18.5577 13.3131 16.3341C13.3131 14.1104 15.1156 12.3072 17.3392 12.3069Z" />
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M17.3403 0C18.5686.0001 19.7432.4249 20.6979 1.1783L30.3606 8.7217 33.8188 11.4218C34.794 12.1834 34.9664 13.5919 34.205 14.5672 33.4435 15.5421 32.0359 15.7157 31.0607 14.9545L30.633 14.6197 28.3475 29.1924H30.7621C31.9992 29.1926 33.0024 30.1959 33.0027 31.433 33.0027 32.6703 31.9993 33.6734 30.7621 33.6736H3.9186C2.6811 33.6736 1.678 32.6705 1.678 31.433 1.6782 30.1958 2.6813 29.1924 3.9186 29.1924H6.332L4.0455 14.6197 3.6188 14.9545C2.6436 15.7156 1.236 15.5422.4745 14.5672-.2869 13.5919-.1135 12.1834.8618 11.4218L4.3267 8.7152 13.9816 1.1772C14.9364.4239 16.1121 0 17.3403 0ZM17.3403 4.4812C17.1518 4.4812 16.9456 4.5456 16.7539 4.6978L8.0869 11.4645 10.868 29.1924H23.8116L26.5916 11.4645 17.9256 4.6978C17.7341 4.5457 17.5287 4.4813 17.3403 4.4812Z" />
                    </svg>
                    <span>Covey</span>
                </div>
                <div class="splash-loader" role="status" aria-label="Loading">
                    <span></span>
                </div>
            </div>
        </div>
        <div class="calendar-atmosphere" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="calendar-grain" aria-hidden="true"></div>
        <div id="app-root"></div>

        <div id="dialogs-root"></div>

        <div id="settings-root"></div>


        <script type="module" src="app.js"></script>
    </body>
</html>
